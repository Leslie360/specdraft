name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        env:
          SPECDRAFT_TRAIN_PYTHON: python        # unit tests assemble argv only; any python works
          SPECDRAFT_SPECULATORS_REPO: .         # path must exist; engine is not imported by unit tests
        run: python -m pytest -q
