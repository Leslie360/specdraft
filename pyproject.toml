[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specdraft"
version = "0.1.1"
description = "Speculative-draft training pipeline (DFLASH/DSPARK/DFLASH2), orchestrating the vllm-speculators engine end to end, with preset configs for Qwen-family models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "PyYAML>=6",
    "safetensors>=0.4",
]

[project.optional-dependencies]
regen = ["aiohttp>=3.9"]
dev = ["pytest>=8"]

[project.scripts]
specdraft = "specdraft.cli:main"

[tool.setuptools.packages.find]
include = ["specdraft*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
